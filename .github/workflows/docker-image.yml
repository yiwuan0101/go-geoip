name: Build & Publish Docker image

# 推送任意 tag 时自动构建;也可在 GitHub 网页 Actions 页面手动运行(workflow_dispatch)
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # 多架构构建: amd64(常规服务器) + arm64(ARM 机器);只用 amd64 可删掉 arm64 加快构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub 自带的镜像仓库 ghcr.io,用的就是你仓库的内置令牌,无需配置任何账号密钥
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像最终发布地址: ghcr.io/yiwuan0101/go-geoip:<tag> 以及 :latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
