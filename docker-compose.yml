services:
  go-geoip:
    image: ghcr.io/yiwuan0101/go-geoip:latest  # 自己 fork 构建的镜像,由 GitHub Actions 自动发布到 ghcr.io
    container_name: go-geoip
    restart: always
    ports:
      - "7099:7099"
    volumes:
      - ./data:/app/go-geoip/data  # 数据库存放目录,持久化后重启不必重新下载
    environment:
      - API_SECRET=123456  # [可选]修改此行为请求头校验的值（前后端统一）
      - TZ=Asia/Shanghai
      # - CITY_DB_REMOTE_URL=https://xxx.com/GeoIP2-City.mmdb  # [可选]自定义City数据库下载地址
      # - ASN_DB_REMOTE_URL=https://xxx.com/GeoLite2-ASN.mmdb  # [可选]自定义ASN数据库下载地址
      # - CN_DB_REMOTE_URL=https://xxx.com/GeoCN.mmdb  # [可选]自定义CN数据库下载地址
    logging:
      driver: json-file
      options:
        max-size: "10m"   # 单个日志文件上限
        max-file: "3"     # 最多保留份数,合计约 30MB
